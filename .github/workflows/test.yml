# =====================================================================
# NOT DEPLOYED — STAGED FILE ONLY (Phase 4, 7 Nov 2026).
# This workflow is NOT live on GitHub. It was prepared locally and has
# NOT been pushed via the API: the token behind the API helper lacks
# workflow scope, so an API push of a .github/workflows/ file would
# fail with 403. The parent deploys it via the GitHub web UI (browser
# route) and then confirms the file exists on main and the first run
# is observed green (or red, triaged honestly).
# Do NOT describe this workflow as deployed, running, or green until
# the parent confirms that deployment and a run.
#
# TARGET:
#   Repo:   ShirjanKhadka1/investment-analyst-toolkit
#   Branch: main
#   Path:   .github/workflows/test.yml   (UPDATE — replaces the Phase 7 file)
#
# Change vs the live Phase 7 file: the quality job no longer runs the
# individual ruff/mypy/coverage commands; it installs the pinned dev
# tools from requirements-dev.txt and runs `python scripts/qa.py`,
# the single Phase 4 entry point (lint, typecheck, full tests +
# coverage, look-ahead mutation check, licence, secret scan, link
# check, README-claim check, fresh-clone install test). Matrix and
# smoke jobs are unchanged.
# fetch-depth: 0 is deliberate: the secret gate scans `git log -p`,
# and the default shallow checkout would make that scan vacuous.
# =====================================================================
# Phase 7: OS x Python matrix + quality gates.
# Matrix job (pytest only) runs on Linux/macOS/Windows —
# macOS/Windows combinations are CI-only: they were never run
# locally, and their first GitHub run is the proof. Quality and
# smoke jobs stay on ubuntu-latest, where they were verified.
# All CI dependencies are pinned to versions measured 28 Oct 2026.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest==9.2.0" "tzdata==2026.6"
      - run: python -m pytest tests/ -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/qa.py
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m toolkit.cli predict
      - run: python -m toolkit.cli option --S 100 --K 100 --T 1 --r 0.05 --sigma 0.2
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest==9.2.0" -r requirements-numpy.txt
      - run: python -m pytest tests/ -q
