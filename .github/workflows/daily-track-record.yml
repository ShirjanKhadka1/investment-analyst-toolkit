# Daily track record — DEPLOYED 13 Nov 2026.
# Watchlist approved by the owner 13 Nov 2026 (SPY, AAPL, VT, NIFTYBEES.NS, ISF.L, EURUSD=X, BTC-USD); workflow deployment approved the same day.
# Purpose: once a day, fetch the seven watchlist tickers, run the pre-registered direction rules, log one directional call per ticker (5-trading-day horizon, non-overlapping), settle calls whose horizon has passed, and commit results to the DATA branch (data/track-record) — NEVER to main.
# Safety: the script writes results ONLY to the data branch (--publish-branch data/track-record, --publish). It refuses --publish-branch main outright, logs each call before its outcome, records a failed fetch as a missed day (never filled in), and is idempotent — a re-run never duplicates a call.
name: Daily track record

on:
  schedule:
    # 22:00 UTC daily — after the NYSE close (21:00 UTC).
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the daily track-record step
        run: |
          python3 scripts/track_record_daily.py \
            --calls data/track-record/calls.jsonl \
            --out data/track-record/track-record.md \
            --publish-branch data/track-record \
            --publish
