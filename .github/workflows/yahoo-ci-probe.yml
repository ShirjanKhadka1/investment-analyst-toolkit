# Yahoo CI probe — STAGED, not deployed.
#
# Purpose: measure whether Yahoo Finance answers from a GitHub-hosted
# runner, the same way it does (or does not) from a developer VM.
# The toolkit's own Yahoo connector is the probe: if Yahoo tarpits
# this VM's egress IP by User-Agent (observed 8 Nov 2026: chart API
# timed out for SPY, 7203.T, EURUSD=X and BTC-USD while a browser
# User-Agent returned 200 in ~1s), a runner may behave differently.
#
# Round 3 change (8 Nov 2026): the symbol list is a workflow_dispatch
# INPUT, not hardcoded. Default is the original three symbols
# (SPY, 7203.T, EURUSD=X); dispatch with any comma-separated list to
# probe other candidates — e.g. "NIFTYBEES.NS,ISF.L" for the Round 3
# India/UK watchlist candidates. First probe (8 Nov 2026) from a
# runner: PROBE 3/3 OK (SPY n=251, 7203.T n=243, EURUSD=X n=260,
# all last 2026-11-06) — Yahoo answers from runners, unlike this VM.
#
# Manual dispatch ONLY (workflow_dispatch, no schedule, no
# push/pull_request triggers): this is a measurement, not a gate.
# The job always exits 0 and prints a per-symbol OK/FAIL line with
# the exact error text plus a summary count — a failing probe is
# data, not a broken build. Do NOT turn it into a required check.
#
# Deploy: copy this file to .github/workflows/yahoo-ci-probe.yml
# (browser route — the API token has no workflow scope). A
# workflow_dispatch workflow only registers once its file is on the
# default branch: the file must exist on main to be dispatchable.
# Then dispatch it from the Actions tab and read the log.
name: Yahoo CI probe

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Yahoo symbols to probe"
        required: false
        default: "SPY,7203.T,EURUSD=X"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Yahoo for daily series
        env:
          PROBE_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python3 - <<'PYEOF'
          import os
          from toolkit.connectors import fetch_prices

          SYMBOLS = [s.strip() for s in
                     os.environ.get("PROBE_SYMBOLS", "SPY,7203.T,EURUSD=X")
                     .split(",") if s.strip()]
          ok = 0
          for symbol in SYMBOLS:
              try:
                  result = fetch_prices(symbol, kind="stock")
                  pairs = result["pairs"]
                  print(f"{symbol} OK n={len(pairs)} "
                        f"source={result['source']} "
                        f"last={pairs[-1][0]} close={pairs[-1][1]}")
                  ok += 1
              except Exception as exc:  # noqa: BLE001 — the error IS the data
                  print(f"{symbol} FAIL {type(exc).__name__}: {exc}")
          print(f"PROBE {ok}/{len(SYMBOLS)} OK")
          PYEOF
