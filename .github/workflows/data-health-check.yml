# Data health check — INFORMATIONAL ONLY (replaces the 7 Nov 2026 file).
#
# Deployed via the GitHub web UI (browser route) as
# .github/workflows/data-health-check.yml, replacing the previous
# file of the same name. The API token lacks workflow scope, so
# workflow files cannot be pushed via the API.
#
# Change vs the previous file (the reason for this replacement):
# the old file had a `pull_request` trigger, so its live probe
# (Yahoo, CoinGecko, ECB, World Bank) was a required check on PRs
# touching scripts/data_health.py, toolkit/connectors.py or
# data_health.json. On 14 Nov 2026 it failed PR #32 on a World Bank
# fetch timeout (Yahoo/CoinGecko/ECB fresh) — a vendor outage, not
# a code defect. External-network probes must not gate merges.
#
# Behaviour now: daily at 09:30 UTC (15:15 NPT) and on manual
# dispatch, it probes live data health and writes the report as a
# 30-day artifact. The probe step NEVER fails the job: a DEGRADED
# source is data, printed in the log and the report, not a broken
# build. The step fails only if the report itself cannot be written
# (an infrastructure failure, not a vendor outage).
#
# Alerting on DEGRADED is NOT lost: "Daily derived refresh"
# (09:15 UTC) also probes health, FAILS its job when overall is
# DEGRADED, and is watched by the Failure alert workflow, which
# opens an issue. This workflow's own failure was redundant for
# alerting. The workflow NAME is unchanged ("Data health check")
# so the Failure alert watch list needs no change.
#
# This workflow commits nothing and needs only contents: read.
# Research only: no trades, no spend, no recommendations. No secrets.

name: Data health check

on:
  schedule:
    # 09:30 UTC = 15:15 NPT, after the daily derived refresh.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe data health (informational — never fails the job)
        # The probe exits 2 when any source is DEGRADED. That is data,
        # not a broken build, so the failure is swallowed on purpose.
        # The per-source detail is in the log and the report artifact.
        run: |
          python3 scripts/data_health.py --probe --output /tmp/data_health.json || true
          python3 -c "import json; print('INFORMATIONAL overall:', json.load(open('/tmp/data_health.json'))['overall'])"
      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-health
          path: /tmp/data_health.json
          retention-days: 30
