# Failure alert — LIVE on main since 8 Nov 2026. Watches the workflows listed below in the SAME repo (workflow_run only fires for workflows in the same repo, on the default branch). When a watched run completes with conclusion 'failure', it opens ONE GitHub issue. It does NOT send email and does NOT alert on its own failures. Research only. No trades, no spend, no recommendations. No secrets. (A second copy lives in finance-research-agents watching 'Daily health check'.)

name: Failure alert

on:
  workflow_run:
    workflows: ["Scheduled update", "Daily derived refresh", "Data health check", "Daily track record"]
    types: [completed]

permissions:
  issues: write

jobs:
  open-issue-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh issue create --repo ShirjanKhadka1/investment-analyst-toolkit\
            --title "Scheduled run failed: ${RUN_NAME} #${RUN_NUMBER}" \
            --label "automation-failure" \
            --body "A scheduled workflow run failed.

          - Workflow: ${RUN_NAME}
          - Run: ${RUN_URL}
          - Branch: ${RUN_BRANCH}
          - Commit: ${RUN_SHA}
          - Conclusion: failure

          Triage: check the run log, then the generated output
          (reports/daily/ — a failed symbol keeps its previous latest.md
          and is labelled STALE_OR_FAILED; stale output is never fresh).
          Research only. No trades, no spend, no recommendations."
