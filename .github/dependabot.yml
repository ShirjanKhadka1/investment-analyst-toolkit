# Phase 7: Dependabot config. Enablement on GitHub is TO VERIFY
# after deployment; nothing here creates a pull request by itself.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
