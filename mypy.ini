# Phase 7: mypy guardrail, honest scope.
# Measured 28 Oct 2026: `mypy toolkit/` passes under DEFAULT settings
# (mypy 2.4.0, 20 source files, no issues). Default mypy does NOT
# check untyped functions, and this codebase is largely untyped —
# so a pass here is a guardrail against new typed-code errors, NOT
# a claim of full type safety. Full annotations are a follow-up.
[mypy]
python_version = 3.10
warn_unused_ignores = True

# Round 6 (13 Nov 2026): numpy is an OPTIONAL extra for
# toolkit/strategy_backtester.py (requirements-numpy.txt), never a
# core dependency — so `mypy toolkit/` must pass in a numpy-free
# environment too (CI quality job installs requirements-dev.txt
# only). This section is the standard per-module treatment for an
# optional import: it silences only the missing-import error for
# numpy itself. It does not weaken any check on toolkit code.
[mypy-numpy]
ignore_missing_imports = True
