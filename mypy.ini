# Phase 7: mypy guardrail, honest scope.
# Measured 28 Oct 2026: `mypy toolkit/` passes under DEFAULT settings
# (mypy 2.4.0, 20 source files, no issues). Default mypy does NOT
# check untyped functions, and this codebase is largely untyped —
# so a pass here is a guardrail against new typed-code errors, NOT
# a claim of full type safety. Full annotations are a follow-up.
[mypy]
python_version = 3.10
warn_unused_ignores = True
