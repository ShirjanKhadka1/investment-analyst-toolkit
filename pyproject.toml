[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-analyst-toolkit"
version = "0.5.0"
description = "Tested, explicit finance calculations for investment and research analysts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["toolkit*"]
