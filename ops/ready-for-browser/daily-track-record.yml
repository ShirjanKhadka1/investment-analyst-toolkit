# Daily track record — STAGED, NOT DEPLOYED.
#
# Purpose: once a day, fetch the seven watchlist tickers
# (docs/watchlist-proposal.md), run the pre-registered direction
# rules (docs/direction-rules.md), log one directional call per
# ticker (5-trading-day horizon, non-overlapping), settle calls
# whose horizon has passed, and commit the results to the DATA branch
# (data/track-record) — NEVER to main. Main carries the code and the
# spec; the data branch carries the outcomes.
#
# DO NOT DEPLOY YET. This workflow is staged only: the watchlist
# itself is a proposal — it needs the user's approval first
# (docs/watchlist-proposal.md). The runner script
# (scripts/track_record_daily.py) and the direction rules exist and
# are tested; the watchlist approval is the remaining activation
# step before this workflow runs.
#
# Deploy (browser route — the API token has no workflow scope):
# copy this file to .github/workflows/daily-track-record.yml on main
# (a workflow file must exist on the default branch to be dispatched
# or scheduled — see the Yahoo probe, which needed the same step),
# then dispatch it once by hand and read the log before relying on
# the schedule. The schedule below runs daily after the US close.
#
# Safety: the script writes results ONLY to the data branch
# (--publish-branch data/track-record, --publish). It refuses
# --publish-branch main outright, logs each call before its
# outcome, records a failed fetch as a missed day (never filled
# in), and is idempotent — a re-run never duplicates a call.
name: Daily track record

on:
  schedule:
    # 22:00 UTC daily — after the NYSE close (21:00 UTC).
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the daily track-record step
        run: |
          python3 scripts/track_record_daily.py \
            --calls data/track-record/calls.jsonl \
            --out data/track-record/track-record.md \
            --publish-branch data/track-record \
            --publish
